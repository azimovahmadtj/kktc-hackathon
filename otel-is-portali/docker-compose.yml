# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: otelportal
      POSTGRES_USER: otelportal
      POSTGRES_PASSWORD: otelportal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
